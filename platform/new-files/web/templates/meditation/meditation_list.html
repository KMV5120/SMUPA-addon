{% extends 'layout/basic.html' %}
{% load static %}

{% block title %}冥想室预约单{% endblock %}

{% block css %}
    <link rel="stylesheet" href="{% static 'css/reservation_list.css' %}">
    <link rel="stylesheet" href="{% static 'css/meditation.css' %}">
{% endblock %}

{% block content %}
    <div class="container p-md-5">
        <div class="box shadow">
            <div class="box-title">
                <h5><i class="fa fa-leaf" aria-hidden="true"></i> 所有冥想室预约单</h5>
                <a role="button" class="btn btn-sm btn-primary"
                   href="{% url 'new_meditation' %}">
                    <i class="fa fa-plus" aria-hidden="true"></i> 代录预约
                </a>
            </div>
            <div class="box-body p-3">
                {% include 'meditation/_res_table.html' %}
            </div>
        </div>
    </div>
{% endblock %}

{% block js %}
    <script>
        $(function () {
            $('[data-toggle="tooltip"]').tooltip()
        });
    </script>
{% endblock %}
